services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: library-function/src/main/docker/Dockerfile.jvm
      args:
        MAVEN_REPO_URL: ${MAVEN_REPO_URL:-https://repo.maven.apache.org/maven2}
    container_name: library-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/library
      DB_USER: library
      DB_PASSWORD: library
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
