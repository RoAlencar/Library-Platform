quarkus.application.name=library-platform

# ---------------------------------------------------------------------------
# Dates & time zone
# All domain dates are wall-clock times in America/Sao_Paulo (GMT-3, see
# br.com.fiap.shared.domain.LibraryTime) and are serialized as ISO-8601 with
# offset, e.g. 2026-11-09T10:15:30-03:00.
# ---------------------------------------------------------------------------
quarkus.jackson.timezone=America/Sao_Paulo
quarkus.jackson.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
# Datasource (PostgreSQL). Override with DB_URL / DB_USER / DB_PASSWORD.
# In dev mode (no DB_URL) Quarkus Dev Services starts a PostgreSQL container.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:library}
quarkus.datasource.password=${DB_PASSWORD:library}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/library}

# Schema: kept across restarts in prod (docker volume), recreated in dev/test
quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create


# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (/q/swagger-ui, spec at /q/openapi)
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Library Platform API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Online library (FIAP Tech Challenge - Phase 2). Dates are ISO-8601 in America/Sao_Paulo (-03:00).

# ---------------------------------------------------------------------------
# Tests: in-memory H2 (no Docker required)
# ---------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.devservices.enabled=false
